# artifacts-canvas Helm chart — all deployment-specific values live here.
# Nothing in this file contains hostnames or credentials: supply them per environment.

# --- Container image ---
# Pin by digest in production (the chart renders `repository@digest` when digest is set).
image:
  repository: ghcr.io/pocharlies-org/artifacts-canvas-server
  tag: "0.1.0"
  digest: "" # e.g. sha256:<64 hex> — set this for immutable deploys
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- Core plugin contract (design §8) ---
# Defaults match the core chart (pocharlies-org/artifacts helm/artifacts): the gate is the
# Service `artifact-gate` in namespace `sso` (decision port 8081), the login proxy is
# mounted at /oauth2-artifacts/, and the routes are served by Traefik.
core:
  # REQUIRED: the artifacts host (the core chart's `artifactsHost`), e.g. artifacts.mycorp.net.
  # No default: rendering fails when it is empty or an example.* placeholder, unless both
  # core.artifactBaseUrl and core.allowedOrigins are set explicitly.
  publicHost: ""
  # The artifacts bucket (the core chart's `minio.bucket`); empty = s3.bucket.
  bucket: ""
  # Internal authz endpoint of the core's gate (never the public URL).
  gateAuthzUrl: "http://artifact-gate.sso.svc.cluster.local:8081/_gate/plugin/authz"
  # Where the frame route fetches artifact HTML, with the visitor's cookie: the core's EDGE
  # (Traefik forwardAuth to the gate, then the gate-signed MinIO read), exactly like a browser
  # read. Empty = https://<publicHost>/<bucket>.
  artifactBaseUrl: ""
  # Where a visitor with no session is sent from the wrapper page, `{rd}` = the original path
  # (URL-encoded): the core chart's login proxy. Empty = unauthenticated visitors get a 403.
  loginUrl: "/oauth2-artifacts/sign_in?rd={rd}"
  # Browser origins allowed to open the WebSocket (CSWSH guard). Empty = https://<publicHost>.
  allowedOrigins: []
  # Namespace label selector of the core's namespace (the gate), for the NetworkPolicy.
  namespace:
    kubernetes.io/metadata.name: sso

# --- Object storage (canvas documents) ---
# The operator supplies the credentials secret (keys below); the core's bootstrap Job uses it
# to create/attach the least-privilege S3 user `plugin-canvas` (Get/Put/Delete/GetTagging/
# PutTagging on `_plugins/canvas/*`, ListBucket on the prefix). In the core's `plugins:` entry
# this same secret is the optional `secretName` field (default `plugin-canvas-s3`).
s3:
  bucket: artifacts
  region: us-east-1
  # Set for MinIO / S3-compatible endpoints; leave empty for AWS.
  endpoint: ""
  forcePathStyle: true
  prefix: _plugins/canvas
  # Secret created by the core's provisioning (or ExternalSecrets), never by this chart.
  # Never put credentials in values.
  secretRef:
    name: plugin-canvas-s3
    accessKeyIdKey: access-key
    secretAccessKeyKey: secret-key

# --- Anonymous visitors ---
# ANON_COOKIE_SECRET signs the anonymous-visitor cookie (server-assigned "Anónimo NNNN"
# pseudonym and the visitor id their attribution is bound to). Without it each pod uses a
# random per-process key: cookies (and anonymous ids) do not survive a restart and are not
# valid on another replica. REQUIRED when deployment.replicas > 1. Never put the value here:
# reference an existing Secret (ExternalSecrets / operator-created), at least 32 random bytes.
anon:
  cookieSecretRef:
    name: "" # e.g. artifacts-canvas-anon
    key: anon-cookie-secret

# --- Behaviour ---
config:
  authzTimeoutMs: 3000
  # Upper bound on how long a revoked/expired visitor may keep a live room.
  authzRecheckSeconds: 300
  frameFetchTimeoutMs: 10000
  saveDebounceMs: 2000
  sweepIntervalSeconds: 3600
  readyzCacheMs: 5000
  logLevel: info

# --- Abuse limits (anonymous gets the stricter set; enforced by the server) ---
limits:
  maxConnsPerRoom: 50
  maxConnsPerRoomAnon: 10
  # Live connections per anonymous visitor (cookie) and per logged-in user, over ALL rooms of
  # the pod (a refused join closes with 1013 and the client retries).
  maxConnsPerAnonVisitor: 2
  maxConnsPerUser: 8
  # Presence states a room relays (each connection holds one: its own client id).
  maxAwarenessPerRoom: 50
  msgRatePerSec: 120
  msgBurst: 240
  anonMsgRatePerSec: 30
  anonMsgBurst: 60
  maxDocBytes: 20971520 # 20 MiB
  anonMaxDocBytes: 5242880 # 5 MiB
  maxMessageBytes: 8388608 # 8 MiB
  anonMaxMessageBytes: 2097152 # 2 MiB
  maxImageBytes: 2097152
  anonMaxImageBytes: 1048576
  # A peer that stops reading is dropped once the server holds this much for it (beyond the
  # join burst).
  wsMaxBufferedBytes: 8388608 # 8 MiB
  # ...and by a timer once it stays over that cap this long (not only on its next send).
  wsSlowConsumerMs: 10000
  # Bytes held for all peers together (join payloads in flight counted once per room
  # version). Joins beyond it are refused with 1013; the peers holding most are dropped.
  wsOutgoingBudgetBytes: 268435456 # 256 MiB — part of the memory formula below
  # The join payload must reach the peer at least this fast (30 s floor).
  wsJoinMinBytesPerSec: 32768
  # Ping every peer; one that answers no ping for two rounds and drains nothing is dropped.
  wsPingIntervalMs: 30000
  # Sync step-2 answers after the first one per connection, bytes/s and burst.
  syncBytesPerSec: 1048576
  syncBurstBytes: 4194304
  anonSyncBytesPerSec: 262144
  anonSyncBurstBytes: 1048576
  # Joins per principal (user id / anonymous visitor cookie), per room for anonymous joins
  # that bring no visitor cookie, and per client IP for anonymous joins (only when
  # clientIpHops says where the IP comes from). A refused join closes with 1013 (retry).
  joinRatePerMin: 30
  joinBurst: 20
  anonJoinRatePerMin: 10
  anonJoinBurst: 6
  anonRoomJoinRatePerMin: 60
  anonRoomJoinBurst: 30
  anonIpJoinRatePerMin: 30
  anonIpJoinBurst: 20
  # Where the client IP comes from: -1 = unknown (no per-IP limit), 0 = the TCP peer,
  # n = the n-th entry from the right of X-Forwarded-For (n trusted proxies in front, e.g. 1
  # behind one Traefik that appends the client address).
  clientIpHops: -1
  # Server CPU time (ms) one principal's messages may use per second, and the burst (shared
  # by all its connections).
  cpuMsPerSec: 250
  cpuBurstMs: 5000
  anonCpuMsPerSec: 60
  anonCpuBurstMs: 1000
  # Server CPU of all connections together, and of all anonymous ones. While one is used up,
  # messages bigger than cpuShedMinBytes are refused with 1013 (the client resends them).
  cpuTotalMsPerSec: 600
  cpuTotalBurstMs: 6000
  anonCpuTotalMsPerSec: 150
  anonCpuTotalBurstMs: 1500
  cpuShedMinBytes: 16384
  # Attribution of shapes deleted longer ago than this is pruned from the ledger.
  attributionRetentionDays: 30
  # Optional key-space allowlist, e.g. ["runs/", "pub/"]. Empty = any structurally valid key.
  artifactPrefixes: []
  anonAllowedPrefixes: ["pub/"]

# --- Service ---
service:
  type: ClusterIP
  port: 8080

# --- Metrics (Prometheus) ---
# Served on their own internal port, never on the public route (the public listener answers
# 404 for /metrics). Scrape <service>:<metrics.port>/metrics from the namespaces allowed below.
metrics:
  enabled: true
  port: 9091

# --- NetworkPolicy ---
# Ingress to the canvas pods: the http port only from the ingress controller's namespace and
# the core's namespace (the canvas calls the gate, but co-allowing the core keeps the pair
# connected if the ingress rewrites source); the metrics port only from metricsNamespaces.
# Egress is unrestricted: the server must reach the core, its edge and the object store.
networkPolicy:
  enabled: true
  # The ingress controller's namespace (the core chart's routes are Traefik IngressRoutes).
  ingressNamespace:
    kubernetes.io/metadata.name: traefik-system
  # Namespaces allowed to scrape the metrics port (empty list = nobody).
  metricsNamespaces:
    - kubernetes.io/metadata.name: monitoring

# Rooms are in-memory: with more than one replica, two pods would serve divergent rooms for
# the same artifact unless the ingress does sticky routing per artifact key. Keep 1 until
# sticky routing (or a shared backend) is designed.
deployment:
  replicas: 1

# Memory: size the limit from the document size cap. Measured (fv5 H-1): a loaded room costs
# ~22x its encoded size (content + ledger, what limits.maxDocBytes caps) in heap + buffers, and
# decoding/checking/applying one message ~24x the message. So, with 24x as headroom:
#
#   limit >= 192 MiB                              (Node runtime, libraries, slack)
#          + hotRooms x 24 x limits.maxDocBytes    (rooms at the size cap loaded at once)
#          + limits.wsOutgoingBudgetBytes          (bytes held for slow peers)
#          + 24 x limits.maxMessageBytes           (one max-size message in flight)
#
# Defaults (maxDocBytes 20 MiB, budget 256 MiB, maxMessageBytes 8 MiB), 2 hot full rooms:
#   192 + 2 x 480 + 256 + 192 = 1600 MiB  ->  2Gi with ~25% headroom.
# nodeMaxOldSpaceMb caps the V8 heap below the limit (~75% of it) so the process collects
# garbage before the kernel's OOM killer acts; buffers live outside that heap. Change both
# together. (The previous 1Gi held one full room; an attack added a second copy and the pod
# was OOM-killed.)
nodeMaxOldSpaceMb: 1536
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: "" # defaults to the fullname
