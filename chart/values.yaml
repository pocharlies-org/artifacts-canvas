# artifacts-canvas Helm chart — all deployment-specific values live here.
# Nothing in this file contains hostnames or credentials: supply them per environment.

# --- Container image ---
# Pin by digest in production (the chart renders `repository@digest` when digest is set).
image:
  repository: ghcr.io/pocharlies-org/artifacts-canvas-server
  tag: "0.1.0"
  digest: "" # e.g. sha256:<64 hex> — set this for immutable deploys
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- Core plugin contract (design §8) ---
# Defaults match the core chart (pocharlies-org/artifacts helm/artifacts): the gate is the
# Service `artifact-gate` in namespace `sso` (decision port 8081), the login proxy is
# mounted at /oauth2-artifacts/, and the routes are served by Traefik.
core:
  # REQUIRED: the artifacts host (the core chart's `artifactsHost`), e.g. artifacts.mycorp.net.
  # No default: rendering fails when it is empty or an example.* placeholder, unless both
  # core.artifactBaseUrl and core.allowedOrigins are set explicitly.
  publicHost: ""
  # The artifacts bucket (the core chart's `minio.bucket`); empty = s3.bucket.
  bucket: ""
  # Internal authz endpoint of the core's gate (never the public URL).
  gateAuthzUrl: "http://artifact-gate.sso.svc.cluster.local:8081/_gate/plugin/authz"
  # Where the frame route fetches artifact HTML, with the visitor's cookie: the core's EDGE
  # (Traefik forwardAuth to the gate, then the gate-signed MinIO read), exactly like a browser
  # read. Empty = https://<publicHost>/<bucket>.
  artifactBaseUrl: ""
  # Where a visitor with no session is sent from the wrapper page, `{rd}` = the original path
  # (URL-encoded): the core chart's login proxy. Empty = unauthenticated visitors get a 403.
  loginUrl: "/oauth2-artifacts/sign_in?rd={rd}"
  # Browser origins allowed to open the WebSocket (CSWSH guard). Empty = https://<publicHost>.
  allowedOrigins: []
  # Namespace label selector of the core's namespace (the gate), for the NetworkPolicy.
  namespace:
    kubernetes.io/metadata.name: sso

# --- Object storage (canvas documents) ---
# The operator supplies the credentials secret (keys below); the core's bootstrap Job uses it
# to create/attach the least-privilege S3 user `plugin-canvas` (Get/Put/Delete/GetTagging/
# PutTagging on `_plugins/canvas/*`, ListBucket on the prefix). In the core's `plugins:` entry
# this same secret is the optional `secretName` field (default `plugin-canvas-s3`).
s3:
  bucket: artifacts
  region: us-east-1
  # Set for MinIO / S3-compatible endpoints; leave empty for AWS.
  endpoint: ""
  forcePathStyle: true
  prefix: _plugins/canvas
  # Secret created by the core's provisioning (or ExternalSecrets), never by this chart.
  # Never put credentials in values.
  secretRef:
    name: plugin-canvas-s3
    accessKeyIdKey: access-key
    secretAccessKeyKey: secret-key

# --- Anonymous visitors ---
# ANON_COOKIE_SECRET signs the anonymous-visitor cookie (server-assigned "Anónimo NNNN"
# pseudonym and the visitor id their attribution is bound to). Without it each pod uses a
# random per-process key: cookies (and anonymous ids) do not survive a restart and are not
# valid on another replica. REQUIRED when deployment.replicas > 1. Never put the value here:
# reference an existing Secret (ExternalSecrets / operator-created), at least 32 random bytes.
anon:
  cookieSecretRef:
    name: "" # e.g. artifacts-canvas-anon
    key: anon-cookie-secret

# --- Behaviour ---
config:
  authzTimeoutMs: 3000
  # Upper bound on how long a revoked/expired visitor may keep a live room.
  authzRecheckSeconds: 300
  frameFetchTimeoutMs: 10000
  saveDebounceMs: 2000
  # Server CPU (ms/s, burst ms) the debounced saves of all rooms may use together: a save encodes
  # the whole room, so tiny edits in many big rooms could keep the server busy saving. A save
  # that is due waits while this is used up (flushes on last leave and shutdown never wait).
  saveCpuMsPerSec: 50
  saveCpuBurstMs: 1000
  sweepIntervalSeconds: 3600
  readyzCacheMs: 5000
  logLevel: info

# --- Abuse limits (anonymous gets the stricter set; enforced by the server) ---
limits:
  maxConnsPerRoom: 50
  maxConnsPerRoomAnon: 10
  # Live connections per anonymous visitor (cookie) and per logged-in user, over ALL rooms of
  # the pod (a refused join closes with 1013 and the client retries).
  maxConnsPerAnonVisitor: 2
  maxConnsPerUser: 8
  # Presence states a room relays (each connection holds one: its own client id).
  maxAwarenessPerRoom: 50
  msgRatePerSec: 120
  msgBurst: 240
  anonMsgRatePerSec: 30
  anonMsgBurst: 60
  # Size caps (content + ledger per room; per message; pasted images). A full room must fit one
  # principal's share of the room memory budget (see "Memory" below): the server lowers these to
  # what the budget holds and warns at start ("memory sizing: ...") when the pod's memory is too
  # small for them. The defaults fit the default 2304Mi.
  maxDocBytes: 5242880 # 5 MiB
  anonMaxDocBytes: 1310720 # 1.25 MiB
  maxMessageBytes: 4194304 # 4 MiB
  anonMaxMessageBytes: 1048576 # 1 MiB
  maxImageBytes: 2097152 # 2 MiB
  anonMaxImageBytes: 524288 # 512 KiB
  # A peer that stops reading is dropped once the server holds this much for it (beyond the
  # join burst).
  wsMaxBufferedBytes: 8388608 # 8 MiB
  # ...and by a timer once it stays over that cap this long (not only on its next send).
  wsSlowConsumerMs: 10000
  # Bytes held for all peers together (join payloads in flight counted once per room
  # snapshot). Over it: peers that stopped reading are dropped first, then the ones holding
  # most; a join is refused with 1013 only while everything held is still draining.
  wsOutgoingBudgetBytes: 268435456 # 256 MiB — part of the memory formula below
  # The join payload must reach the peer at least this fast (30 s floor).
  wsJoinMinBytesPerSec: 32768
  # Ping every peer; one that answers no ping for two rounds and drains nothing is dropped.
  wsPingIntervalMs: 30000
  # A peer holding more than 256 KiB that drained less than wsJoinMinBytesPerSec for this long
  # counts as stalled (dropped first when the outgoing budget is short).
  wsStallMs: 3000
  # Sync step-2 answers after the first one per connection, bytes/s and burst.
  syncBytesPerSec: 1048576
  syncBurstBytes: 4194304
  anonSyncBytesPerSec: 262144
  anonSyncBurstBytes: 1048576
  # Joins per principal (user id / anonymous visitor cookie), per room for anonymous joins
  # that bring no visitor cookie, and per client IP for anonymous joins (only when
  # clientIpHops says where the IP comes from). A refused join closes with 1013 (retry).
  joinRatePerMin: 30
  joinBurst: 20
  anonJoinRatePerMin: 10
  anonJoinBurst: 6
  anonRoomJoinRatePerMin: 60
  anonRoomJoinBurst: 30
  anonIpJoinRatePerMin: 30
  anonIpJoinBurst: 20
  # Where the client IP comes from: -1 = unknown (no per-IP limit), 0 = the TCP peer,
  # n = the n-th entry from the right of X-Forwarded-For. Default 1: the core chart's Traefik,
  # which appends the address of whoever connected to it. Count one more for every proxy in
  # front of Traefik that appends too (an L7 load balancer or CDN Traefik trusts). Too few hops
  # only merges clients into the proxy's bucket (per-IP limits act like a global one); too MANY
  # lets a client pick its own key with a forged X-Forwarded-For entry, so never overcount.
  # If Traefik only sees a node or load-balancer address (externalTrafficPolicy: Cluster
  # without the PROXY protocol), every client shares that address: use -1 there.
  clientIpHops: 1
  # Anonymous visitor cookies minted per minute and burst (each one is a new principal with
  # budgets of its own): the wrapper page and cookieless WebSocket joins have a global bucket
  # each, and every client IP one more (when clientIpHops says where the IP comes from). Over
  # them the page is served without a cookie and a cookieless join gets 1013 (retry).
  anonMintRatePerMin: 120
  anonMintBurst: 60
  anonIpMintRatePerMin: 10
  anonIpMintBurst: 10
  # Server CPU time (ms) one principal's messages may use per second, and the burst (shared
  # by all its connections).
  cpuMsPerSec: 250
  cpuBurstMs: 5000
  anonCpuMsPerSec: 60
  anonCpuBurstMs: 1000
  # Server CPU of all connections together, and of all anonymous ones. While one is used up,
  # messages bigger than cpuShedMinBytes are refused with 1013 (the client resends them).
  cpuTotalMsPerSec: 600
  cpuTotalBurstMs: 6000
  anonCpuTotalMsPerSec: 150
  anonCpuTotalBurstMs: 1500
  cpuShedMinBytes: 16384
  # Cuts of items one update may make, and the Yjs time (ms) its cuts, placement, merges and
  # deletes may take by the server's estimate (fv8 P1/P2: one update of 200 000 cuts held the
  # server for a minute; fv9 A-C: runs and pairs of items that Yjs merges, deletes that make it
  # merge). Over either, the sender is closed 4413. Since fv9 the update runs in its room's worker
  # (see `worker`), so this bounds one message's worker time, not a stall of the server: honest
  # deletes of thousands of shapes take Yjs 0.4-0.8 s, hence 1000 (it was 50).
  maxSplitsPerMessage: 5000
  maxApplyMs: 1000
  # Client blocks (Yjs client ids) one update may carry (fv9 E: 20 000 of them made the guard's
  # dependency check quadratic). An honest update carries one, a resync a few. Over it: 4413.
  maxClientsPerUpdate: 256
  # Attribution of shapes deleted longer ago than this is pruned from the ledger.
  attributionRetentionDays: 30
  # Loaded-room memory budget in bytes (see "Memory" below). 0 = derived by the server from the
  # V8 heap limit, so it follows nodeMaxOldSpaceMb; set it only to go lower.
  roomMemoryBudgetBytes: 0
  # What one logged-in principal may be charged for (the rooms it loaded and everything it wrote,
  # in full, while those rooms stay loaded): a third of the budget; an anonymous visitor a quarter
  # of that (1/12). And what all anonymous visitors together may be charged for: a third. The two
  # together must stay <= 0.8 (the growth threshold), so others can always load and grow.
  roomMemoryPrincipalShare: 0.3333
  roomMemoryAnonShare: 0.3333
  # Optional key-space allowlist, e.g. ["runs/", "pub/"]. Empty = any structurally valid key.
  artifactPrefixes: []
  anonAllowedPrefixes: ["pub/"]

# --- Room isolation (fv9) ---
# Every loaded room runs in a worker thread of its own (its documents, the guard, the stamper, the
# apply), with a V8 heap limit derived from the room budget (a room at its largest plus one message
# being processed); the main thread only does HTTP/WebSocket, authorization, budgets, routing and
# broadcast. It waits for each answer with a watchdog: a client message may take
# messageTimeoutMs + timeoutNsPerByte per byte of it (its apply up to twice the guard's estimate
# on top), an operation on the whole room opTimeoutMs + opNsPerByte per byte of the room. A worker
# that misses it or runs out of its heap is terminated; the message's sender is closed (4413) and
# struck, and the room is rebuilt in a fresh worker from its saved objects plus the log of every
# change since (never the offending message), then every client is asked for what it holds.
# strikes faults within strikeWindowMs refuse the principal's joins and writes for
# strikeCooldownMs (1013); anonymous visitors also count per client IP (when clientIpHops says
# where it is) and all together (anonPoolStrikes). applyConcurrency client messages are processed
# at once over all rooms (the memory formula below reserves one message per slot).
worker:
  messageTimeoutMs: 250
  timeoutNsPerByte: 1000
  opTimeoutMs: 10000
  opNsPerByte: 2000
  applyConcurrency: 1
  strikes: 3
  strikeWindowMs: 600000
  strikeCooldownMs: 600000
  anonPoolStrikes: 10

# --- Service ---
service:
  type: ClusterIP
  port: 8080

# --- Metrics (Prometheus) ---
# Served on their own internal port, never on the public route (the public listener answers
# 404 for /metrics). Scrape <service>:<metrics.port>/metrics from the namespaces allowed below.
metrics:
  enabled: true
  port: 9091

# --- NetworkPolicy ---
# Ingress to the canvas pods: the http port only from the ingress controller's namespace and
# the core's namespace (the canvas calls the gate, but co-allowing the core keeps the pair
# connected if the ingress rewrites source); the metrics port only from metricsNamespaces.
# Egress is unrestricted: the server must reach the core, its edge and the object store.
networkPolicy:
  enabled: true
  # The ingress controller's namespace (the core chart's routes are Traefik IngressRoutes).
  ingressNamespace:
    kubernetes.io/metadata.name: traefik-system
  # Namespaces allowed to scrape the metrics port (empty list = nobody).
  metricsNamespaces:
    - kubernetes.io/metadata.name: monitoring

# Rooms are in-memory: with more than one replica, two pods would serve divergent rooms for
# the same artifact unless the ingress does sticky routing per artifact key. Keep 1 until
# sticky routing (or a shared backend) is designed.
deployment:
  replicas: 1

# Memory. The server keeps the rooms it has loaded under a budget it derives from the V8 heap
# limit, so it is right for whatever nodeMaxOldSpaceMb is (server/src/config.ts, protocol §11):
#
#   heap limit   = nodeMaxOldSpaceMb + V8's young generation   (1728 -> 1776 MiB in the image,
#                                                               node:22-alpine)
#   room budget  = heap limit
#                  - 192 MiB                          (Node runtime, libraries, the HTTP side)
#                  - limits.wsOutgoingBudgetBytes     (bytes held for slow peers)
#                  - 60 x limits.maxMessageBytes      (one max-size message being guarded and
#                    x worker.applyConcurrency         applied: measured 51-53x, fv7 F2)
#   loaded room  = 44 x (content + ledger) + 16 MiB   (measured 4x-39.5x by content kind, fv7 F2;
#                                                      16 MiB: the room's worker thread, fv9,
#                                                      measured 15.7 MiB in the image)
#
# fv9: the rooms are no longer in the main thread's heap but in their workers' (nodeMaxOldSpaceMb
# sizes the whole process: the main thread uses a few hundred MiB of it at most). Each worker's
# heap limit is one user share (a room at the size cap fits it), or the stored room's cost when
# that is more, plus 60 x maxMessageBytes: whatever a message makes Yjs allocate past that ends
# the worker (ERR_WORKER_OUT_OF_MEMORY), never the process. With one apply slot, the process holds
# at most: the loaded rooms (85% of the budget) + one worker's message headroom (a share +
# 60 x maxMessageBytes) + the runtime and the outgoing budget: 925 + 603 + 192 + 256 = 1976 MiB
# with the defaults, under the 2304 MiB limit.
#
# Each loaded room's cost is charged to the principal whose join loaded it, and what every update
# adds to the principal that wrote it, in full (readers pay nothing; a charge stays while the room
# stays loaded, also after its principal left; each save replaces the estimates by what the room
# measures). A join that would load a room past 85% of the budget, and an update that would grow
# the loaded rooms past 80% of it, are refused with 1013 (the client retries; joins to loaded rooms
# never are): the 5% between them is always left for loads. A principal may be charged at most
# roomMemoryPrincipalShare (a third), an anonymous visitor a quarter of that, all anonymous
# visitors together roomMemoryAnonShare (a third) — for a room an anonymous visitor loads, the
# anonymous pool pays its full cost even when the visitor is charged one share at most (fv9 F):
# one user and every anonymous visitor together hold at most two thirds, and the rest can always
# load.
# A room at the size cap must fit one share (44 x 1.25 x maxDocBytes + 16 MiB <= a third of the
# budget): the server lowers the caps to what fits, and the message and image caps with them,
# with a warning at start; with a budget smaller than one full room it warns too.
# Defaults: 1776 - 192 - 256 - 240 = 1088 MiB of rooms (the server logs it at start and exports
# canvas_room_memory_budget_bytes and the shares as canvas_room_memory_share_bytes): a share of
# 363 MiB holds one full 5 MiB room (236 MiB with its worker) and an anonymous visitor's 91 MiB
# one full 1.25 MiB anonymous room; loads up to 925 MiB, growth up to 870 MiB. fv9 raised the
# default from 1536 / 2Gi: with a worker per room, 1536 would lower the anonymous cap to 1.07 MiB.
# At 1Gi (nodeMaxOldSpaceMb 768) the caps are lowered, with a warning for each.
#
# Everything the formula subtracts adds up to the heap limit; what lives outside the V8 heap
# (socket buffers, encoded frames, native code, the workers' stacks) needs the rest:
#
#   limits.memory >= nodeMaxOldSpaceMb / 0.75          (1728 / 0.75 = 2304 MiB)
#
# Change both together: the budget follows. CPU: the main thread and one room worker can be busy
# at once (a worker on a message, up to its watchdog); with less than 2 CPUs the worker's time is
# taken from the main thread's.
nodeMaxOldSpaceMb: 1728
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2304Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: "" # defaults to the fullname
