apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artifacts-canvas.fullname" . }}
  labels:
    {{- include "artifacts-canvas.labels" . | nindent 4 }}
data:
  # --- core plugin contract (docs: core repo docs/plugins.md) ---
  GATE_AUTHZ_URL: {{ .Values.core.gateAuthzUrl | quote }}
  ARTIFACT_BASE_URL: {{ include "artifacts-canvas.artifactBaseUrl" . | quote }}
  ALLOWED_ORIGINS: {{ include "artifacts-canvas.allowedOrigins" . | quote }}
  {{- if .Values.core.loginUrl }}
  LOGIN_URL: {{ .Values.core.loginUrl | quote }}
  {{- end }}
  # --- object storage (credentials come from the secret, never from here) ---
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.s3.forcePathStyle | quote }}
  CANVAS_PREFIX: {{ .Values.s3.prefix | quote }}
  {{- if .Values.s3.endpoint }}
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  {{- end }}
  # --- behaviour ---
  PORT: {{ int64 .Values.service.port | quote }}
  METRICS_PORT: {{ ternary (int64 .Values.metrics.port) 0 .Values.metrics.enabled | quote }}
  AUTHZ_TIMEOUT_MS: {{ int64 .Values.config.authzTimeoutMs | quote }}
  AUTHZ_RECHECK_SECONDS: {{ int64 .Values.config.authzRecheckSeconds | quote }}
  FRAME_FETCH_TIMEOUT_MS: {{ int64 .Values.config.frameFetchTimeoutMs | quote }}
  SAVE_DEBOUNCE_MS: {{ int64 .Values.config.saveDebounceMs | quote }}
  SAVE_CPU_MS_PER_SEC: {{ int64 .Values.config.saveCpuMsPerSec | quote }}
  SAVE_CPU_BURST_MS: {{ int64 .Values.config.saveCpuBurstMs | quote }}
  SWEEP_INTERVAL_SECONDS: {{ int64 .Values.config.sweepIntervalSeconds | quote }}
  READYZ_CACHE_MS: {{ int64 .Values.config.readyzCacheMs | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # --- abuse limits (anonymous gets the stricter set) ---
  MAX_CONNS_PER_ROOM: {{ int64 .Values.limits.maxConnsPerRoom | quote }}
  MAX_CONNS_PER_ROOM_ANON: {{ int64 .Values.limits.maxConnsPerRoomAnon | quote }}
  MAX_CONNS_PER_ANON_VISITOR: {{ int64 .Values.limits.maxConnsPerAnonVisitor | quote }}
  MAX_CONNS_PER_USER: {{ int64 .Values.limits.maxConnsPerUser | quote }}
  MAX_AWARENESS_PER_ROOM: {{ int64 .Values.limits.maxAwarenessPerRoom | quote }}
  MSG_RATE_PER_SEC: {{ int64 .Values.limits.msgRatePerSec | quote }}
  MSG_BURST: {{ int64 .Values.limits.msgBurst | quote }}
  ANON_MSG_RATE_PER_SEC: {{ int64 .Values.limits.anonMsgRatePerSec | quote }}
  ANON_MSG_BURST: {{ int64 .Values.limits.anonMsgBurst | quote }}
  # int64: helm would otherwise render large byte counts in scientific notation.
  MAX_DOC_BYTES: {{ int64 .Values.limits.maxDocBytes | quote }}
  ANON_MAX_DOC_BYTES: {{ int64 .Values.limits.anonMaxDocBytes | quote }}
  MAX_MESSAGE_BYTES: {{ int64 .Values.limits.maxMessageBytes | quote }}
  ANON_MAX_MESSAGE_BYTES: {{ int64 .Values.limits.anonMaxMessageBytes | quote }}
  MAX_IMAGE_BYTES: {{ int64 .Values.limits.maxImageBytes | quote }}
  ANON_MAX_IMAGE_BYTES: {{ int64 .Values.limits.anonMaxImageBytes | quote }}
  WS_MAX_BUFFERED_BYTES: {{ int64 .Values.limits.wsMaxBufferedBytes | quote }}
  WS_SLOW_CONSUMER_MS: {{ int64 .Values.limits.wsSlowConsumerMs | quote }}
  WS_OUTGOING_BUDGET_BYTES: {{ int64 .Values.limits.wsOutgoingBudgetBytes | quote }}
  WS_JOIN_MIN_BYTES_PER_SEC: {{ int64 .Values.limits.wsJoinMinBytesPerSec | quote }}
  WS_PING_INTERVAL_MS: {{ int64 .Values.limits.wsPingIntervalMs | quote }}
  WS_STALL_MS: {{ int64 .Values.limits.wsStallMs | quote }}
  SYNC_BYTES_PER_SEC: {{ int64 .Values.limits.syncBytesPerSec | quote }}
  SYNC_BURST_BYTES: {{ int64 .Values.limits.syncBurstBytes | quote }}
  ANON_SYNC_BYTES_PER_SEC: {{ int64 .Values.limits.anonSyncBytesPerSec | quote }}
  ANON_SYNC_BURST_BYTES: {{ int64 .Values.limits.anonSyncBurstBytes | quote }}
  JOIN_RATE_PER_MIN: {{ int64 .Values.limits.joinRatePerMin | quote }}
  JOIN_BURST: {{ int64 .Values.limits.joinBurst | quote }}
  ANON_JOIN_RATE_PER_MIN: {{ int64 .Values.limits.anonJoinRatePerMin | quote }}
  ANON_JOIN_BURST: {{ int64 .Values.limits.anonJoinBurst | quote }}
  ANON_ROOM_JOIN_RATE_PER_MIN: {{ int64 .Values.limits.anonRoomJoinRatePerMin | quote }}
  ANON_ROOM_JOIN_BURST: {{ int64 .Values.limits.anonRoomJoinBurst | quote }}
  ANON_IP_JOIN_RATE_PER_MIN: {{ int64 .Values.limits.anonIpJoinRatePerMin | quote }}
  ANON_IP_JOIN_BURST: {{ int64 .Values.limits.anonIpJoinBurst | quote }}
  CLIENT_IP_HOPS: {{ int64 .Values.limits.clientIpHops | quote }}
  ANON_MINT_RATE_PER_MIN: {{ int64 .Values.limits.anonMintRatePerMin | quote }}
  ANON_MINT_BURST: {{ int64 .Values.limits.anonMintBurst | quote }}
  ANON_IP_MINT_RATE_PER_MIN: {{ int64 .Values.limits.anonIpMintRatePerMin | quote }}
  ANON_IP_MINT_BURST: {{ int64 .Values.limits.anonIpMintBurst | quote }}
  CPU_MS_PER_SEC: {{ int64 .Values.limits.cpuMsPerSec | quote }}
  CPU_BURST_MS: {{ int64 .Values.limits.cpuBurstMs | quote }}
  ANON_CPU_MS_PER_SEC: {{ int64 .Values.limits.anonCpuMsPerSec | quote }}
  ANON_CPU_BURST_MS: {{ int64 .Values.limits.anonCpuBurstMs | quote }}
  CPU_TOTAL_MS_PER_SEC: {{ int64 .Values.limits.cpuTotalMsPerSec | quote }}
  CPU_TOTAL_BURST_MS: {{ int64 .Values.limits.cpuTotalBurstMs | quote }}
  ANON_CPU_TOTAL_MS_PER_SEC: {{ int64 .Values.limits.anonCpuTotalMsPerSec | quote }}
  ANON_CPU_TOTAL_BURST_MS: {{ int64 .Values.limits.anonCpuTotalBurstMs | quote }}
  CPU_SHED_MIN_BYTES: {{ int64 .Values.limits.cpuShedMinBytes | quote }}
  MAX_SPLITS_PER_MESSAGE: {{ int64 .Values.limits.maxSplitsPerMessage | quote }}
  MAX_APPLY_MS: {{ int64 .Values.limits.maxApplyMs | quote }}
  ATTRIBUTION_RETENTION_DAYS: {{ int64 .Values.limits.attributionRetentionDays | quote }}
  # loaded-room memory budget: derived by the server from the V8 heap limit unless set
  {{- if .Values.limits.roomMemoryBudgetBytes }}
  ROOM_MEMORY_BUDGET_BYTES: {{ int64 .Values.limits.roomMemoryBudgetBytes | quote }}
  {{- end }}
  ROOM_MEMORY_PRINCIPAL_SHARE: {{ .Values.limits.roomMemoryPrincipalShare | quote }}
  ROOM_MEMORY_ANON_SHARE: {{ .Values.limits.roomMemoryAnonShare | quote }}
  {{- if .Values.limits.artifactPrefixes }}
  ARTIFACT_PREFIXES: {{ join "," .Values.limits.artifactPrefixes | quote }}
  {{- end }}
  {{- if .Values.limits.anonAllowedPrefixes }}
  ANON_ALLOWED_PREFIXES: {{ join "," .Values.limits.anonAllowedPrefixes | quote }}
  {{- end }}
