{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "artifacts-canvas.serviceAccountName" . }}
  labels:
    {{- include "artifacts-canvas.labels" . | nindent 4 }}
# The pod needs no API access: automountServiceAccountToken is false on the Deployment too.
automountServiceAccountToken: false
{{- end }}
