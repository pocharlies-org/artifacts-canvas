{{- if .Values.networkPolicy.enabled -}}
# Ingress to the canvas pods is admitted only from the ingress controller's namespace
# (which forwards the browser's /_canvas/... requests, websockets included) and from the
# core's namespace. Egress is unrestricted: the server must reach the core's gate and the
# object store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifacts-canvas.fullname" . }}
  labels:
    {{- include "artifacts-canvas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifacts-canvas.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespace | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.core.namespace | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
