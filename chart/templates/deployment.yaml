apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifacts-canvas.fullname" . }}
  labels:
    {{- include "artifacts-canvas.labels" . | nindent 4 }}
spec:
  # Rooms are in-memory: replicas > 1 needs sticky routing per artifact key (or a shared
  # backend) or two pods would serve divergent documents for the same artifact.
  {{- if and (gt (int .Values.deployment.replicas) 1) (not .Values.anon.cookieSecretRef.name) }}
  {{- fail "anon.cookieSecretRef.name is required when deployment.replicas > 1 (every pod must sign and verify the same anonymous-visitor cookie)" }}
  {{- end }}
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    type: Recreate # single writer per room; no rolling overlap on the same rooms
  selector:
    matchLabels:
      {{- include "artifacts-canvas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "artifacts-canvas.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "artifacts-canvas.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canvas
          image: {{ include "artifacts-canvas.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "artifacts-canvas.fullname" . }}
          env:
            {{- if .Values.s3.secretRef.name }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretRef.name }}
                  key: {{ .Values.s3.secretRef.accessKeyIdKey }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretRef.name }}
                  key: {{ .Values.s3.secretRef.secretAccessKeyKey }}
            {{- end }}
            {{- if .Values.anon.cookieSecretRef.name }}
            - name: ANON_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anon.cookieSecretRef.name }}
                  key: {{ .Values.anon.cookieSecretRef.key }}
            {{- end }}
          securityContext:
            # The server writes nothing: read-only root filesystem. Node needs a writable tmp.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
