name: ci

on:
  push:
    # every branch: CI only reads (permissions below), so a branch of any name gets its run
    # before a pull request exists. Publishing stays in publish.yml, on main only.
    branches: ["**"]
  pull_request:

# Read-only token for every job. Nothing here publishes: the server image is pushed only by
# publish.yml, on push to main.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: shell syntax
        run: bash -n tests/image_smoke.sh
      - name: helm chart lints and renders
        run: |
          # `! cmd` never fails a step (bash -e ignores negated commands): renders that must fail go through fails
          fails() { if "$@" >/dev/null 2>&1; then echo "expected to fail: $*"; exit 1; fi; }
          helm lint chart/ -f chart/ci/ci-values.yaml
          helm template chart/ -f chart/ci/ci-values.yaml >/dev/null
          # required values fail the render
          fails helm template chart/
          fails helm template chart/ --set core.publicHost=artifacts.example.com
          fails helm template chart/ -f chart/ci/ci-values.yaml --set deployment.replicas=2
          helm template chart/ -f chart/ci/ci-values.yaml --set deployment.replicas=2 --set anon.cookieSecretRef.name=canvas-anon | grep -q 'name: ANON_COOKIE_SECRET'
          # the memory limit must hold heapLimitMb (values.yaml "Memory"): a bad pair fails the render
          helm template chart/ -f chart/ci/ci-values.yaml --set heapLimitMb=816 --set resources.limits.memory=1Gi >/dev/null
          fails helm template chart/ -f chart/ci/ci-values.yaml --set heapLimitMb=2000
          fails helm template chart/ -f chart/ci/ci-values.yaml --set resources.limits.memory=2Gi
          fails helm template chart/ -f chart/ci/ci-values.yaml --set resources.limits.memory=2304X
          helm template chart/ -f chart/ci/ci-values.yaml | grep -q 'WORKER_INFLIGHT_BYTES: "67108864"'
          # anonymous drawing: off unless anon.enabled says so, and always rendered (the server's own
          # default is on); a value that is not a boolean fails the render
          helm template chart/ -f chart/ci/ci-values.yaml | grep -q 'ANON_ENABLED: "false"'
          helm template chart/ -f chart/ci/ci-values.yaml --set anon.enabled=true | grep -q 'ANON_ENABLED: "true"'
          fails helm template chart/ -f chart/ci/ci-values.yaml --set-string anon.enabled=false
          fails helm template chart/ -f chart/ci/ci-values.yaml --set anon.enabled=null
          # the worker test hooks are never rendered, alerts or not
          if helm template chart/ -f chart/ci/ci-values.yaml --set alerts.enabled=true | grep -q WORKER_TEST_HOOKS; then exit 1; fi
          helm template chart/ -f chart/ci/ci-values.yaml --set alerts.enabled=true | grep -q 'kind: PrometheusRule'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: e2e-results
          path: |
            client/test-results
            client/screenshots
          retention-days: 7
          if-no-files-found: ignore

  server-image:
    # Builds server/Dockerfile exactly as publish.yml does and smoke-tests it (labels, uid 1000,
    # read-only code, refusals, healthz). Never pushes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: build server image (linux/amd64)
        run: |
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f server/Dockerfile -t "artifacts-canvas-server:$GITHUB_SHA" .
      - name: smoke test the image
        run: tests/image_smoke.sh "artifacts-canvas-server:$GITHUB_SHA" "$GITHUB_SHA"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # gitleaks v8.30.1, pinned by digest
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --verbose
