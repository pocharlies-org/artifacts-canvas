name: ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: helm chart lints and renders
        run: |
          # `! cmd` never fails a step (bash -e ignores negated commands): renders that must fail go through fails
          fails() { if "$@" >/dev/null 2>&1; then echo "expected to fail: $*"; exit 1; fi; }
          helm lint chart/ -f chart/ci/ci-values.yaml
          helm template chart/ -f chart/ci/ci-values.yaml >/dev/null
          # required values fail the render
          fails helm template chart/
          fails helm template chart/ --set core.publicHost=artifacts.example.com
          fails helm template chart/ -f chart/ci/ci-values.yaml --set deployment.replicas=2
          helm template chart/ -f chart/ci/ci-values.yaml --set deployment.replicas=2 --set anon.cookieSecretRef.name=canvas-anon | grep -q 'name: ANON_COOKIE_SECRET'
          # the memory limit must hold heapLimitMb (values.yaml "Memory"): a bad pair fails the render
          helm template chart/ -f chart/ci/ci-values.yaml --set heapLimitMb=816 --set resources.limits.memory=1Gi >/dev/null
          fails helm template chart/ -f chart/ci/ci-values.yaml --set heapLimitMb=2000
          fails helm template chart/ -f chart/ci/ci-values.yaml --set resources.limits.memory=2Gi
          fails helm template chart/ -f chart/ci/ci-values.yaml --set resources.limits.memory=2304X
          helm template chart/ -f chart/ci/ci-values.yaml | grep -q 'WORKER_INFLIGHT_BYTES: "67108864"'
          # the worker test hooks are never rendered, alerts or not
          if helm template chart/ -f chart/ci/ci-values.yaml --set alerts.enabled=true | grep -q WORKER_TEST_HOOKS; then exit 1; fi
          helm template chart/ -f chart/ci/ci-values.yaml --set alerts.enabled=true | grep -q 'kind: PrometheusRule'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-results
          path: |
            client/test-results
            client/screenshots
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose
