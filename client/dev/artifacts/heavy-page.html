<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavy page</title>
<!--
  A page that is expensive on every frame, the way a "deck" with a 3D backdrop is:
    - a WebGL scene sized to the screen with window.innerWidth x innerHeight (the usual
      renderer.setSize(innerWidth, innerHeight)), redrawn on every animation frame with a
      fragment shader whose cost follows the canvas's pixels;
    - script work on every frame: labels moved and measured again (getBoundingClientRect), about
      SPIN_MS of main thread;
    - many sections that fade in when an IntersectionObserver reports them;
    - a video (a canvas stream, drawn by a timer).
  window.__heavy says how many frames the scene drew, when (Date.now()), and the canvas's size
  (client/e2e/perf.spec.ts).
-->
<style>
  html, body { margin: 0; background: #0b1020; color: #e5e7eb; font: 16px/1.5 system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  section { min-height: 100vh; padding: 48px 56px; box-sizing: border-box; border-bottom: 1px solid #1f2937; }
  h2 { margin: 0 0 12px; font-size: 28px; }
  .rv { opacity: 0; transform: translateY(24px); transition: opacity .5s, transform .5s; }
  .in .rv { opacity: 1; transform: none; }
  .labels { position: fixed; left: 0; top: 0; width: 100%; height: 0; pointer-events: none; }
  .label { position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 8px; background: rgba(15, 23, 42, .85); font-size: 12px; white-space: nowrap; }
  video { width: 320px; height: 180px; background: #000; display: block; margin-top: 16px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="labels" id="labels"></div>
<main id="main"></main>
<script>
(function () {
  'use strict';
  var SPIN_MS = 4;
  var main = document.getElementById('main');
  for (var i = 0; i < 12; i++) {
    var s = document.createElement('section');
    s.id = 's' + (i + 1);
    s.innerHTML = '<h2 class="rv">Section ' + (i + 1) + '</h2>' +
      '<p class="rv">A screen of the page. It fades in once an IntersectionObserver reports it.</p>' +
      '<p class="rv">Line two of section ' + (i + 1) + '.</p>' + (i === 1 ? '<video id="vid" muted loop playsinline autoplay></video>' : '');
    main.appendChild(s);
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); });
  }, { threshold: 0.1 });
  Array.prototype.forEach.call(document.querySelectorAll('section'), function (s) { io.observe(s); });

  // the video: a stream of a small canvas drawn by a timer
  var src = document.createElement('canvas');
  src.width = 320; src.height = 180;
  var g2 = src.getContext('2d');
  var tick = 0;
  setInterval(function () {
    tick++;
    g2.fillStyle = 'hsl(' + (tick * 7 % 360) + ',70%,40%)';
    g2.fillRect(0, 0, 320, 180);
    g2.fillStyle = '#fff';
    g2.fillRect((tick * 5) % 320, 80, 20, 20);
  }, 33);
  var vid = document.getElementById('vid');
  try { vid.srcObject = src.captureStream(30); vid.play().catch(function () {}); } catch (e) { /* no stream */ }

  // labels moved and measured on every frame
  var box = document.getElementById('labels');
  var labels = [];
  for (var k = 0; k < 40; k++) {
    var l = document.createElement('div');
    l.className = 'label';
    l.textContent = 'Label ' + (k + 1);
    box.appendChild(l);
    labels.push(l);
  }

  // the WebGL scene, sized to the screen as most 3D pages do
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl', { antialias: false });
  var state = window.__heavy = { frames: 0, at: [], w: 0, h: 0, cssH: 0, gl: !!gl };
  var prog = null;
  var uT = null;
  var uR = null;
  if (gl) {
    var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
    var fs = 'precision mediump float; uniform float t; uniform vec2 r;' +
      'void main() { vec2 uv = gl_FragCoord.xy / r; float v = 0.0;' +
      ' for (int i = 0; i < 24; i++) { float fi = float(i); v += sin(uv.x * (6.0 + fi) + t * 0.9 + fi) * cos(uv.y * (4.0 + fi) - t * 0.7); }' +
      ' gl_FragColor = vec4(0.05 + 0.03 * v, 0.08 + 0.02 * v, 0.18 + 0.04 * v, 1.0); }';
    var sh = function (type, text) { var o = gl.createShader(type); gl.shaderSource(o, text); gl.compileShader(o); return o; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uT = gl.getUniformLocation(prog, 't');
    uR = gl.getUniformLocation(prog, 'r');
  }
  function resize() {
    var pr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * pr);
    canvas.height = Math.round(h * pr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    state.w = canvas.width; state.h = canvas.height; state.cssH = h;
  }
  window.addEventListener('resize', resize);
  resize();

  function frame(now) {
    requestAnimationFrame(frame);
    state.frames++;
    state.at.push(Date.now());
    if (state.at.length > 4000) state.at.shift();
    var t0 = performance.now();
    if (gl) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform1f(uT, now / 1000);
      gl.uniform2f(uR, canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    var vh = window.innerHeight;
    for (var i = 0; i < labels.length; i++) {
      var x = 40 + ((i * 97 + now / 20) % 860);
      var y = 40 + ((i * 53) % Math.max(60, vh - 80));
      labels[i].style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      labels[i].getBoundingClientRect();
    }
    while (performance.now() - t0 < SPIN_MS) { /* the rest of a heavy page's frame */ }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
