<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report with a broken image</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:#1d1d1f;background:#fff}
  .wrap{padding:36px 48px;font-size:14px;line-height:1.55}
  .block{width:600px;height:300px;background:#2b8a3e;margin:24px 0}
  .tall{height:1200px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Report with a broken image</h1>
  <p>The image below is a relative file that does not exist next to this page.</p>
  <img src="missing-chart.png" alt="chart" width="320" height="160">
  <div class="block" data-testid="green-block"></div>
  <div class="tall">The rest of the report.</div>
</div>
</body>
</html>
