# artifacts-canvas as a plugin of the artifacts core's compose stack (laptop/dev only).
#
# This file `include`s the core's deploy/compose/docker-compose.yml (MinIO + Dex +
# oauth2-proxy + gate + Caddy) from a checkout of pocharlies-org/artifacts, and adds the
# canvas service. The core is configured through its plugin variables (canvas.env): Caddy
# routes /_canvas/ to this service, the bootstrap creates the S3 user `plugin-canvas` scoped
# to _plugins/canvas/, and the gate's ACL cache is short so revocation shows up fast.
#
#   export ARTIFACTS_CORE_DIR=/path/to/artifacts     # default: ../artifacts next to this repo
#   docker compose up -d --build --wait               # whole system, bootstrap included
#   npm run e2e:system                                # from the repo root (see README)
#
# The canvas talks to the core's REAL plugin authz (gate :8081 /_gate/plugin/authz) and the
# REAL MinIO. Every credential here is a fixed dev placeholder; all ports bind 127.0.0.1.
name: artifacts

include:
  - path: ${ARTIFACTS_CORE_DIR:-../../../artifacts}/deploy/compose/docker-compose.yml
    env_file: ./canvas.env

services:
  canvas:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: artifacts-canvas-server:compose
    environment:
      GATE_AUTHZ_URL: http://gate:8081/_gate/plugin/authz
      # artifact HTML for the frame route goes through the core's edge (forwardAuth + the
      # gate's signed read) with the visitor's cookie, exactly like a browser read
      ARTIFACT_BASE_URL: http://caddy/artifacts
      LOGIN_URL: /oauth2/sign_in?rd={rd}
      # the browser's origin (Caddy on 127.0.0.1:8080); any other Origin is refused (4403)
      ALLOWED_ORIGINS: http://127.0.0.1:8080
      # Prometheus on its own port, reachable only inside the compose network (not published,
      # not routed by Caddy): wget http://127.0.0.1:9091/metrics inside the container
      METRICS_PORT: "9091"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: artifacts
      S3_ACCESS_KEY_ID: plugin-canvas
      S3_SECRET_ACCESS_KEY: plugin-canvas-dev-password   # same value as canvas.env
      CANVAS_PREFIX: _plugins/canvas
      # short on purpose (dev): a revoked visitor is dropped within ~3 s + the gate ACL cache
      AUTHZ_RECHECK_SECONDS: "3"
      SAVE_DEBOUNCE_MS: "300"
      LOG_LEVEL: info
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      gate: {condition: service_started}
      caddy: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
